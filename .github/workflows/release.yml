name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish portable build
        shell: pwsh
        run: |
          dotnet publish .\Shelvia\Shelvia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\publish\win-x64-portable

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipPath = "publish\Shelvia-$tag-win-x64-portable.zip"
          $exePath = "publish\Shelvia-$tag-win-x64.exe"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          if (Test-Path $exePath) {
            Remove-Item $exePath -Force
          }

          Copy-Item .\publish\win-x64-portable\Shelvia.exe $exePath
          Compress-Archive -Path .\publish\win-x64-portable\* -DestinationPath $zipPath -Force

          "EXE_PATH=$exePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.EXE_PATH }}
            ${{ env.ZIP_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}